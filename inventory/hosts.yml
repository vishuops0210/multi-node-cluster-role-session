# Fill in your real IPs and SSH user, then delete the CHANGE_ME values.
# Hostnames here are the hostnames the common role will set on each VM.
all:
  children:
    control_plane:
      hosts:
        master1:
          ansible_host: CHANGE_ME
        master2:
          ansible_host: CHANGE_ME
        master3:
          ansible_host: CHANGE_ME
    workers:
      hosts:
        worker1:
          ansible_host: CHANGE_ME
        worker2:
          ansible_host: CHANGE_ME
    haproxy:
      hosts:
        haproxy1:
          ansible_host: CHANGE_ME
  vars:
    ansible_user: ubuntu
    ansible_become: true
