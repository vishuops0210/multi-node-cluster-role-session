# cluster is split across Mumbai ap-south-1 and Virginia us-east-1.
# Hostnames here are the hostnames the common role will set on each VM.
# Mumbai key pair: restore. Virginia key pair: k8s-multi-node-us-east-1.
# The controller VM needs SSH access to all 7 other VMs before you run Ansible.
all:
  children:
    controller:
      hosts:
        controller:
          ansible_host: 13.201.54.123
          instance_id: i-0cbc0a85d9a11cc09
          region: ap-south-1
    control_plane:
      hosts:
        master1:
          ansible_host: 65.2.34.247
          instance_id: i-0fb2a19ad71c44ac8
          region: ap-south-1
        master2:
          ansible_host: 52.66.204.75
          instance_id: i-03af2492f3429091e
          region: ap-south-1
        master3:
          ansible_host: 13.201.51.173
          instance_id: i-0cbdf8b3b4410777c
          region: ap-south-1
    workers:
      hosts:
        worker1:
          ansible_host: 3.91.209.251
          instance_id: i-0a671c332e6e59d91
          region: us-east-1
        worker2:
          ansible_host: 32.196.116.31
          instance_id: i-092981b47965b5a2c
          region: us-east-1
        worker3:
          ansible_host: 13.222.98.232
