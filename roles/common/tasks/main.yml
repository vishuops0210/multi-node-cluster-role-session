# Common role: PDF Phases 2 to 5.
# Runs on every control plane node and every worker node.
# No prechecks, no asserts. Straight commands from the PDF, in PDF order.

- name: Update apt index
  ansible.builtin.apt:
    update_cache: true

- name: Set hostname from inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add all cluster nodes to /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: "0644"

# Phase 3: kernel and network tuning
- name: Load overlay module now
  ansible.builtin.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module now
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/containerd.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Set Kubernetes sysctl values
  ansible.builtin.copy:
    dest: /etc/sysctl.d/kubernetes.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

# Phase 4: container runtime
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup = false'
    line: '\1SystemdCgroup = true'
    backrefs: true

- name: Start and enable containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

# Phase 5: Kubernetes components
- name: Install packages needed for the Kubernetes repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes repo key
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /"
    filename: kubernetes
    state: present

- name: Install pinned kubeadm, kubelet, kubectl and cri-tools
  ansible.builtin.apt:
    update_cache: true
    name:
      - "kubeadm={{ k8s_version }}"
      - "kubelet={{ k8s_version }}"
      - "kubectl={{ k8s_version }}"
      - "cri-tools={{ k8s_version }}"
    state: present

- name: Hold Kubernetes packages at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl
